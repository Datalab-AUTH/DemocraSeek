# DemocraSeek onboarding and response-policy configuration.
#
# This file is the single source of truth for onboarding wording, answer codes
# and personalisation policy fragments. The frontend renders it through the
# backend API and does not duplicate its questions or choices.
#
# Coverage: 7 roles x 6 intents x 6 support needs x 5 modes = 1,260 profiles,
# expressed as 24 reusable fragments plus 5 global guardrails and the
# deterministic compiler in app/onboarding/compiler.py.

policy_version: "2.0"

# Language changes presentation only. The stable R/I/S/M codes and their
# English policy instructions below remain identical in every locale.
default_locale: "en"
locales:
  - code: "en"
    display_name: "English"
    native_name: "English"
  - code: "el"
    display_name: "Greek"
    native_name: "Ελληνικά"
  - code: "fr"
    display_name: "French"
    native_name: "Français"
  - code: "es"
    display_name: "Spanish"
    native_name: "Español"
  - code: "nl-BE"
    display_name: "Dutch (Belgium)"
    native_name: "Nederlands (België)"

onboarding_ui:
  language_label: "Choose your language"
  progress: "Step {current} of {total}"
  not_chosen: "Not chosen yet"
  choose_option_error: "Please choose one option to continue."
  back: "Back"
  cancel: "Cancel"
  next: "Next"
  finish: "Start using DemocraSeek"
  no_questions: "No onboarding questions are configured."
  step_titles:
    role: "Who you are"
    intent: "What you need"
    support: "Support"
    mode: "Answer style"

precedence_note: >-
  Global grounding and safety rules are absolute and can never be relaxed by a
  personalisation preference. When personalisation instructions conflict, apply
  them in this priority order: Support first, then Intent, then Role, then
  Presentation mode. Support determines the adaptation needed for the response
  to remain accessible and useful; Mode shapes its final presentation without
  overriding that support need or the user's intent.

global_guardrails:
  - "G1 - Source-grounded only: substantive answers must be grounded only in the retrieved INNOVADE Digital Democracy Knowledge Base evidence, with citations and provenance. If that evidence is insufficient, say so. Consortium-curated external resources may appear only when the application explicitly supplies them; label them as Further reading, distinguish them from INNOVADE evidence, and never invent or present them as part of the knowledge base."
  - "G2 - Support-aware explanation: adapt the response to the selected role, intent, support need and mode without framing the user as deficient or inferring any unselected personal characteristic."
  - "G3 - Clear, concise and accessible by default: keep every response intuitive and well structured, including in detailed mode, using adapted language and relevant examples where the evidence supports them."
  - "G4 - Practical and reflective where relevant: when the topic concerns participation, trust, risks, inclusion or other democratic implications, combine practical information with the relevant wider implications supported by the evidence."
  - "G5 - Avoid impersonal dead ends: when the user needs support with a digital process or institutional procedure, state what is known, what remains unknown and the next realistic step supported by the evidence rather than ending with an impersonal or bureaucratic response."

questions:
  # ------------------------------------------------------------------ role
  - id: q_role
    dimension: role
    order: 1
    required: true
    prompt: "Which best describes your role in relation to digital democracy?"
    help_text: "This changes the relevance and framing of explanations, never what the evidence says."
    choices:
      - code: "R1"
        label: "Citizen / resident"
        description: "I am exploring what digital democracy means for me or my community."
        instructions:
          - "Use plain language and minimal jargon."
          - "Focus on what the information means for the user or their community."
          - "Use everyday examples supported by the evidence."
          - "Prefer practical implications over theory-first framing."
      - code: "R2"
        label: "Public official / policymaker"
        description: "I work in or with public administration or policymaking."
        instructions:
          - "Use governance and public-administration framing."
          - "Emphasise implementation, institutional feasibility, participation design, transparency and responsiveness."
          - "Highlight public-administration implications where the evidence supports them."
      - code: "R3"
        label: "Researcher / student"
        description: "I am studying or researching digital democracy."
        instructions:
          - "Use higher conceptual precision."
          - "Make distinctions between related concepts explicit."
          - "Use greater citation and provenance density where the claims require it."
          - "Include relevant caveats and interpretation notes."
      - code: "R4"
        label: "Digital democracy project manager / technology developer"
        description: "I design, manage, procure or deploy digital democracy solutions."
        instructions:
          - "Use implementation and solution-design framing."
          - "Emphasise technical feasibility, user requirements, interoperability, accessibility, usability, data governance and integration with institutional workflows."
          - "Link concepts to design choices, system features, deployment conditions and stakeholder needs."
          - "Avoid purely academic discussion unless requested, while retaining enough conceptual precision to support responsible design."
      - code: "R5"
        label: "Civil society / community organisation"
        description: "I work with or represent a community, association or NGO."
        instructions:
          - "Use inclusion and community framing."
          - "Emphasise outreach, participation challenges, support mechanisms, collective action and local engagement."
          - "Link knowledge to facilitation and mobilisation where the evidence supports it."
      - code: "R6"
        label: "Business / professional"
        description: "I am exploring the topic in a commercial or professional capacity."
        instructions:
          - "Use concise strategic framing."
          - "Focus on applicability, ecosystem relevance, stakeholder value and institutional context."
          - "Avoid academic overload unless requested."
      - code: "R7"
        label: "Other / not sure"
        description: "None of these fits, or I am not sure."
        instructions:
          - "Use a balanced, citizen-friendly default."
          - "Use moderate jargon and define unfamiliar terminology."
          - "Give a short explanation first and make deeper exploration available."

  # ---------------------------------------------------------------- intent
  - id: q_intent
    dimension: intent
    order: 2
    required: true
    prompt: "What would you like to do?"
    help_text: "This determines what the answer is trying to help you accomplish."
    choices:
      - code: "I1"
        label: "Understand a concept or topic"
        description: "Explain what something means and why it matters."
        instructions:
          - "Start with a definition or direct explanation."
          - "Clarify adjacent concepts where necessary."
          - "Explain why the topic matters."
          - "Connect it to digital democracy and participation where relevant and supported by the evidence."
      - code: "I2"
        label: "Find evidence, examples, or sources"
        description: "Show me what the knowledge base says and where it comes from."
        instructions:
          - "Prioritise evidence extraction."
          - "Lead with cited findings, examples and provenance."
          - "Minimise broad interpretation unless requested."
      - code: "I3"
        label: "Plan a decision, policy, action, or engagement activity"
        description: "Help me assess options and plan a grounded next move."
        instructions:
          - "Structure the response around options, implications, trade-offs, risks and enabling conditions."
          - "For public officials, include implementation and stakeholder-engagement considerations supported by the evidence."
          - "For citizens and civil society, include actionable participation pathways supported by the evidence."
          - "Where relevant, include outreach, inclusion, facilitation and participation-design considerations."
      - code: "I4"
        label: "Learn how to participate or use a digital service"
        description: "Help me understand a participation or digital-service process."
        instructions:
          - "Prefer procedural, stepwise and practical guidance."
          - "Explain terminology only where it is needed."
          - "Include common pitfalls and confidence-building support where the evidence provides them."
      - code: "I5"
        label: "Explore risks, participation challenges, or inclusion issues"
        description: "Examine what can obstruct or weaken inclusive participation."
        instructions:
          - "Foreground structural, institutional, cultural and user-profile dimensions."
          - "Do not reduce the issue to technical access alone."
      - code: "I6"
        label: "Browse / discover relevant knowledge"
        description: "Give me an overview of relevant topics in the knowledge base."
        instructions:
          - "Provide a curated overview organised into themed clusters."
          - "Suggest relevant follow-up prompts only about subjects present in the retrieved evidence."
          - "Keep the initial answer light and make deeper exploration available."

  # --------------------------------------------------------------- support
  - id: q_support
    dimension: support
    order: 3
    required: true
    prompt: "What would support you most while exploring the knowledge base?"
    help_text: "This determines the adaptation that will make answers most useful to you."
    choices:
      - code: "S1"
        label: "Understanding unfamiliar terms or concepts"
        description: "Help me build up unfamiliar ideas clearly."
        instructions:
          - "Use clear and accessible language."
          - "Define unfamiliar terms inline and avoid unnecessary jargon."
          - "Break complex ideas into understandable components."
          - "Build explanations progressively from basic to more advanced concepts."
      - code: "S2"
        label: "Navigating digital tools or online participation processes"
        description: "Make digital actions, stages and requirements easier to follow."
        instructions:
          - "Use a practical and supportive tone."
          - "Do not assume prior experience with digital tools."
          - "Make actions, stages and requirements explicit."
          - "Distinguish clearly between receiving information and taking action."
          - "Include practical cues and confidence-building guidance where useful and supported."
      - code: "S3"
        label: "Assessing whether information and sources are reliable"
        description: "Make the evidence basis, provenance and limitations clear."
        instructions:
          - "Make source provenance clearly visible."
          - "Explain the evidence basis of important claims."
          - "Distinguish evidence from interpretation."
          - "State uncertainty and limitations clearly."
          - "Where relevant and supported, flag misinformation, bias, data-handling or platform-trust concerns."
          - "Clearly distinguish INNOVADE knowledge-base sources from any explicitly supplied consortium-curated external resources."
      - code: "S4"
        label: "Connecting the topic to my local or community context"
        description: "Relate the topic to local participation and community needs."
        instructions:
          - "Use community, municipal and local-governance framing."
          - "Prioritise place-based evidence and examples where available."
          - "Emphasise relevance to local participation, community needs and everyday civic life."
          - "Connect broader concepts to possible local implications without inventing local evidence."
      - code: "S5"
        label: "Understanding institutional roles, procedures, or responsibilities"
        description: "Clarify who is responsible, how processes connect and what may happen next."
        instructions:
          - "Translate institutional terminology into clear language."
          - "Explain relevant actors, roles and responsibilities."
          - "Clarify procedural relationships and sequences."
          - "Highlight relevant decision points, responsibilities and possible next steps supported by the evidence."
          - "Do not assume that institutional or digital administrative processes are self-explanatory."
      - code: "S6"
        label: "No specific support needed"
        description: "Use standard clarity without additional support-specific adaptation."
        instructions:
          - "Apply no additional support-specific adaptation."
          - "Do not oversimplify or add unnecessary guidance."
          - "Let the selected role, intent and answer mode primarily determine the response."
          - "Maintain the global requirements for clarity, accessibility and source grounding."

  # ------------------------------------------------------------------ mode
  - id: q_mode
    dimension: mode
    order: 4
    required: true
    prompt: "How would you like the answers to be presented?"
    help_text: "This controls the structure and presentation, without reducing evidence requirements."
    choices:
      - code: "M1"
        label: "Simple summary"
        description: "A short overview followed by the key points."
        instructions:
          - "Start with a short overview."
          - "Present three to five key points where the evidence supports that many."
          - "Keep citations visible but unobtrusive."
          - "Allow deeper exploration through follow-up."
      - code: "M2"
        label: "Step-by-step guidance"
        description: "Numbered, action-oriented steps or stages."
        instructions:
          - "Use numbered steps."
          - "Use action-oriented phrasing."
          - "Keep each step focused on one action or stage."
          - "Explain why a step matters only where useful."
          - "Do not add an action or stage that is not supported by the retrieved evidence."
      - code: "M3"
        label: "Detailed explanation"
        description: "A structured synthesis with context, implications and caveats."
        instructions:
          - "Cover the concept, context, implications and relevant caveats."
          - "Provide a more complete synthesis."
          - "Use clear sections rather than an essay-like structure."
          - "Preserve accessibility despite the greater level of detail."
      - code: "M4"
        label: "Evidence with citations"
        description: "An evidence-first answer with prominent sources."
        instructions:
          - "Lead with evidence and source-grounded findings."
          - "Use frequent inline citations."
          - "Make provenance and the source basis explicit."
          - "Clearly distinguish evidence, interpretation and uncertainty."
      - code: "M5"
        label: "Examples from real life / practice"
        description: "Concrete, scenario-led examples that show practical relevance."
        instructions:
          - "Use scenario-based explanations."
          - "Prioritise concrete cases and practical examples supported by the retrieved evidence."
          - "Relate concepts to participation, administration, community or governance practice."
          - "Explain what each example illustrates and why it is relevant."

